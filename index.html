<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site</title>
  <style>
    /* Estilos Gerais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
    }

    /* Cabeçalho e Navegação */
    header {
      background: #2c3e50;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #1abc9c;
    }

    /* Seção Hero (Principal) */
    .hero {
      background: linear-gradient(135deg, #1abc9c, #16a085);
      color: white;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background: #2c3e50;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #34495e;
    }

    /* Seção do Conteúdo Principal */
    .container {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .card h3 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    /* Rodapé */
    footer {
      text-align: center;
      padding: 2rem;
      background: #e2e8f0;
      color: #666;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>MeuSite</h1>
    <nav>
      <a href="#inicio">Início</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <section class="hero" id="inicio">
    <h2>Bem-vindo ao meu novo site!</h2>
    <p>Um layout simples, moderno e pronto para você personalizar.</p>
    <a href="#sobre" class="btn">Saiba Mais</a>
  </section>

  <main class="container" id="sobre">
    <div class="cards">
      <div class="card">
        <h3>🚀 Rápido</h3>
        <p>Desenvolvido com estrutura leve e limpa em HTML e CSS puro.</p>
